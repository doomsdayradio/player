name: Portable builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      signed: ${{ steps.verify-signature.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust toolchain
        run: rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x64-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-x64-rust-${{ env.RUST_TOOLCHAIN }}-
      - name: Format, tests and lint
        shell: pwsh
        run: |
          cargo "+$env:RUST_TOOLCHAIN" fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$env:RUST_TOOLCHAIN" test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo "+$env:RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Single EXE
        shell: pwsh
        run: |
          cargo "+$env:RUST_TOOLCHAIN" build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/doomsday-radio.exe dist/doomsday-radio-windows-x64.exe
      - name: Check signing configuration
        id: signing-config
        shell: pwsh
        env:
          SIGNING_REQUIRED: ${{ vars.SIGNPATH_ENABLED == 'true' && github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if ($env:SIGNING_REQUIRED -eq 'true') {
            foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "Missing signing configuration: $name"
              }
            }
            'enabled=true' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=false' >> $env:GITHUB_OUTPUT
          }
      - name: Upload EXE for signing
        id: unsigned-exe
        if: steps.signing-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-windows-x64
          path: dist/doomsday-radio-windows-x64.exe
          if-no-files-found: error
          retention-days: 1
      - name: Request SignPath signature
        if: steps.signing-config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Verify Windows signature
        id: verify-signature
        shell: pwsh
        env:
          SIGNING_REQUIRED: ${{ steps.signing-config.outputs.enabled }}
        run: |
          if ($env:SIGNING_REQUIRED -eq 'true') {
            $signedPath = 'signed/doomsday-radio-windows-x64.exe'
            if (-not (Test-Path $signedPath)) { throw 'Signed EXE not returned by SignPath' }
            $signature = Get-AuthenticodeSignature $signedPath
            if ($signature.Status -ne 'Valid') { throw "Invalid Windows signature: $($signature.Status)" }
            if ($null -eq $signature.TimeStamperCertificate) { throw 'Windows signature has no trusted timestamp' }
            Copy-Item $signedPath dist/doomsday-radio-windows-x64.exe -Force
            'signed=true' >> $env:GITHUB_OUTPUT
          } else {
            Write-Output '::notice::Windows signing is disabled; this build contains an unsigned EXE.'
            'signed=false' >> $env:GITHUB_OUTPUT
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doomsday-radio-windows-x64
          path: dist/doomsday-radio-windows-x64.exe
          if-no-files-found: error
          retention-days: 30

  debian:
    runs-on: ubuntu-latest
    container: rust:1.99.0-bookworm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Desktop build libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libasound2-dev libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: debian12-x64-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: debian12-x64-rust-${{ env.RUST_TOOLCHAIN }}-
      - name: Tests
        run: cargo test --locked --release
      - name: Single Linux executable and portable archive
        run: |
          cargo build --locked --release
          linkage="$(ldd -r target/release/doomsday-radio)"
          printf '%s\n' "$linkage"
          if grep -E 'not found|undefined symbol' <<< "$linkage"; then exit 1; fi
          install -Dm755 target/release/doomsday-radio dist/doomsday-radio-linux-x64
          install -Dm644 assets/doomsday-radio.png dist/doomsday-radio.png
          install -Dm755 packaging/linux/install-desktop.sh dist/install-desktop.sh
          tar -C dist -czf dist/doomsday-radio-linux-x64.tar.gz doomsday-radio-linux-x64 doomsday-radio.png install-desktop.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doomsday-radio-linux-x64
          path: dist/doomsday-radio-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  screenshot:
    name: Capture player interface
    needs: debian
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Virtual desktop and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool imagemagick libasound2t64 libgl1 libegl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 libx11-6 libxi6 libxrandr2 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - name: Download Linux build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: doomsday-radio-linux-x64
          path: dist
      - name: Capture rendered window
        shell: bash
        env:
          WINIT_UNIX_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          tar -C dist -xzf dist/doomsday-radio-linux-x64.tar.gz
          xvfb-run -a -s '-screen 0 1024x768x24' bash <<'CAPTURE'
          set -euo pipefail
          unset WAYLAND_DISPLAY
          export XDG_RUNTIME_DIR
          XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          ./dist/doomsday-radio-linux-x64 > "$XDG_RUNTIME_DIR/player.log" 2>&1 &
          player_pid=$!
          trap 'kill "$player_pid" 2>/dev/null || true; cat "$XDG_RUNTIME_DIR/player.log"; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          window_id="$(timeout 30s xdotool search --sync --onlyvisible --name '^Doomsday Radio$' | head -n 1)"
          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            kill -0 "$player_pid"
            timeout 5s import -window "$window_id" dist/screenshot.png
            read -r width height colors <<< "$(identify -format '%w %h %k' dist/screenshot.png)"
            if (( width >= 360 && height >= 360 && colors > 64 )); then
              identify dist/screenshot.png
              exit 0
            fi
          done
          echo 'Player window did not render a valid screenshot' >&2
          exit 1
          CAPTURE
      - name: Upload screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doomsday-radio-screenshot
          path: dist/screenshot.png
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [windows, debian, fedora, macos, screenshot]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
    steps:
      - name: Download portable builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: doomsday-radio-*
          merge-multiple: true
          path: dist
      - name: Publish executables and checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/doomsday-radio-windows-x64.exe
          test -s dist/doomsday-radio-linux-x64.tar.gz
          test -s dist/doomsday-radio-macos-universal.tar.gz
          test -s dist/screenshot.png
          (cd dist && sha256sum -- *.exe *.tar.gz *.png > SHA256SUMS)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ "$WINDOWS_SIGNED" == true ]]; then
            windows_signing='Windows: Authenticode signed and timestamped via SignPath.'
          else
            windows_signing='Windows: unsigned; SmartScreen warnings may appear.'
          fi
          notes="Portable builds for Windows x64, Linux x64 and macOS (Intel + Apple Silicon).

          $windows_signing

          Extract the archives before running the player. Linux requires desktop/audio libraries. macOS is ad-hoc signed, not notarized; security warnings may appear.

          Commit: $GITHUB_SHA"

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "Doomsday Radio $tag" \
              --notes "$notes" \
              --draft
          fi
          gh release edit "$tag" --draft=false --latest

  fedora:
    name: Fedora library compatibility
    needs: debian
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Desktop runtime libraries
        run: dnf install -y --setopt=install_weak_deps=False alsa-lib libX11 libXi libXrandr libxkbcommon libwayland-client libwayland-cursor libwayland-egl mesa-libGL mesa-libEGL tar
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: doomsday-radio-linux-x64
          path: dist
      - name: Check the Debian-built binary on Fedora
        run: |
          tar -C dist -xzf dist/doomsday-radio-linux-x64.tar.gz
          test -x dist/doomsday-radio-linux-x64
          linkage="$(ldd -r dist/doomsday-radio-linux-x64)"
          printf '%s\n' "$linkage"
          if grep -E 'not found|undefined symbol' <<< "$linkage"; then exit 1; fi

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-
      - name: Native tests
        run: cargo "+$RUST_TOOLCHAIN" test --locked --release
      - name: Universal macOS app with icon
        run: |
          cargo "+$RUST_TOOLCHAIN" build --locked --release --target aarch64-apple-darwin
          cargo "+$RUST_TOOLCHAIN" build --locked --release --target x86_64-apple-darwin
          app='dist/Doomsday Radio.app'
          iconset='dist/doomsday-radio.iconset'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$iconset"
          lipo -create target/aarch64-apple-darwin/release/doomsday-radio target/x86_64-apple-darwin/release/doomsday-radio -output "$app/Contents/MacOS/doomsday-radio"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/doomsday-radio.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            double_size=$((size * 2))
            sips -z "$double_size" "$double_size" assets/doomsday-radio.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/doomsday-radio.icns"
          version="$(cargo "+$RUST_TOOLCHAIN" metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "doomsday-radio") | .version')"
          plist="$app/Contents/Info.plist"
          plutil -create xml1 "$plist"
          plutil -insert CFBundleName -string 'Doomsday Radio' "$plist"
          plutil -insert CFBundleDisplayName -string 'Doomsday Radio' "$plist"
          plutil -insert CFBundleIdentifier -string 'radio.doomsday.player' "$plist"
          plutil -insert CFBundlePackageType -string APPL "$plist"
          plutil -insert CFBundleExecutable -string doomsday-radio "$plist"
          plutil -insert CFBundleIconFile -string doomsday-radio.icns "$plist"
          plutil -insert CFBundleVersion -string "$version" "$plist"
          plutil -insert CFBundleShortVersionString -string "$version" "$plist"
          plutil -insert LSMinimumSystemVersion -string "$MACOSX_DEPLOYMENT_TARGET" "$plist"
          plutil -insert NSHighResolutionCapable -bool true "$plist"
          plutil -lint "$plist"
          codesign --force --sign - "$app"
          lipo -info "$app/Contents/MacOS/doomsday-radio"
          codesign --verify --deep --strict --verbose "$app"
          test -s "$app/Contents/Resources/doomsday-radio.icns"
          tar -C dist -czf dist/doomsday-radio-macos-universal.tar.gz 'Doomsday Radio.app'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doomsday-radio-macos-universal
          path: dist/doomsday-radio-macos-universal.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0